# PostgreSQL - основная база приложения (используется по умолчанию).
# Запуск: docker compose up -d, затем backend как обычно (mvn spring-boot:run).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
    ports:
      - "5433:5432"
    volumes:
      - messenger_pg_data:/var/lib/postgresql/data

volumes:
  messenger_pg_data:
